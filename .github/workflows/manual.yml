name: Run Python Script

on:
  push:
    branches: [ main ]
  schedule:
    # 每天北京时间 9:10, 13:10, 17:10 运行 (UTC 1:10, 5:10, 9:10)
    - cron: '10 1,5,9 * * *' 
  workflow_dispatch:

env:
  TZ: Asia/Shanghai # 设置全局时区为北京时间

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 安装 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 运行脚本
      env:
        # 这里的变量名需与你 python 脚本中 os.environ.get() 的名称一致
        chinaUnicomCookie: ${{ secrets.CHINAU_COOKIE }}
      run: python chinaUnicom.py

    - name: 推送 Bark 通知
      if: always() # 无论脚本成功或失败都发送通知
      run: |
        # 1. 获取格式化后的北京时间
        NOW=$(date "+%H:%M")
        
        # 2. 准备推送内容
        TITLE="联通脚本"
        BODY="任务于 ${NOW} 执行完毕"
        
        # 3. 使用 Python 对中文进行 URL 编码（解决 Malformed input 报错的关键）
        ENCODED_TITLE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$TITLE'))")
        ENCODED_BODY=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$BODY'))")
        
        # 4. 发送请求
        curl -L "https://api.day.app/${{ secrets.BARK_KEY }}/${ENCODED_TITLE}/${ENCODED_BODY}"
