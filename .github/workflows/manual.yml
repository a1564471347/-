name: Run Python Script

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # UTC 0:00 等于北京时间早上 8:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 安装 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 运行脚本
      env:
        chinaUnicomCookie: ${{ secrets.CHINAU_COOKIE }}
      run: python chinaUnicom.py

    - name: 推送 Bark 通知
      if: always() # 确保脚本运行完（无论成功失败）都会发通知
      run: |
        curl -L "https://api.day.app/${{ secrets.BARK_KEY }}/联通脚本执行完毕/任务状态见日志"
